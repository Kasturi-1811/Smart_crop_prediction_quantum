{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Delete Farm</h2>
    <p>Are you sure you want to delete "{{ farm.farm_name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'farm_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
